name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The signing key is stored as a secret of the "release" environment.
    # Environment secrets are only visible to jobs that declare the environment.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          set -euo pipefail
          # Static config comes from .env.example; the release version is the tag.
          # Vite prefers VITE_* variables from the environment over .env files.
          cp .env.example .env.production
          export VITE_APP_VERSION="${GITHUB_REF_NAME#v}"
          bun run build
          jq -e --arg v "$VITE_APP_VERSION" '.b2g_features.version == $v' dist/manifest.webmanifest

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          zip -r ostore.zip *

      - name: Sign
        env:
          OSTORE_SIGNING_KEY: ${{ secrets.OSTORE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OSTORE_SIGNING_KEY" ]; then
            echo "::error::OSTORE_SIGNING_KEY is empty - add it as a secret of the 'release' environment (or of the repository)"
            exit 1
          fi
          printf '%s\n' "$OSTORE_SIGNING_KEY" \
            | tr -d '\r' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            > "$RUNNER_TEMP/ostore.key"
          chmod 600 "$RUNNER_TEMP/ostore.key"
          key_type=$(openssl pkey -in "$RUNNER_TEMP/ostore.key" -noout -text 2>/dev/null | sed -n '1p' || true)
          echo "signing key: $(wc -l < "$RUNNER_TEMP/ostore.key") lines, type '${key_type:-unreadable}'"
          if [ -z "$key_type" ]; then
            echo "::error::OSTORE_SIGNING_KEY does not contain a readable private key PEM"
            exit 1
          fi
          if ! echo "$key_type" | grep -qi "^ED25519"; then
            echo "::error::OSTORE_SIGNING_KEY must hold an ED25519 private key (got '$key_type')"
            exit 1
          fi
          # OpenSSL 3.0 needs -rawin to sign a whole file with Ed25519 (3.5 implies it);
          # both produce the same pure Ed25519 signature over the archive bytes.
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/ostore.key" \
            -in dist/ostore.zip -out "$RUNNER_TEMP/ostore.sign.bin"

      - name: Publish
        run: |
          set -euo pipefail
          curl -fsS --fail-with-body -X POST https://api-ostore.yexm.eu.org/publish \
            -F "file=@dist/ostore.zip" \
            -F "sign=@$RUNNER_TEMP/ostore.sign.bin" \
            -F "id=ostore"
