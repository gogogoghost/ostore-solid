name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The signing key is stored as a secret of the "release" environment.
    # Environment secrets are only visible to jobs that declare the environment.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          set -euo pipefail
          # The release version is the tag; Vite prefers VITE_* variables from
          # the environment over the values in .env.production.
          export VITE_APP_VERSION="${GITHUB_REF_NAME#v}"
          ./build.sh
          jq -e --arg v "$VITE_APP_VERSION" '.b2g_features.version == $v' dist/manifest.webmanifest

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Idempotent, so re-running after a failed store publish works.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/ostore.zip --clobber
          else
            gh release create "$tag" dist/ostore.zip --title "$tag" --notes "$tag"
          fi

      - name: Publish
        env:
          OSTORE_SIGNING_KEY: ${{ secrets.OSTORE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OSTORE_SIGNING_KEY" ]; then
            echo "::error::OSTORE_SIGNING_KEY is empty - add it as a secret of the 'release' environment (or of the repository)"
            exit 1
          fi
          printf '%s\n' "$OSTORE_SIGNING_KEY" > "$RUNNER_TEMP/ostore.key"
          PRIVATE_PEM_PATH="$RUNNER_TEMP/ostore.key" ./publish.sh
